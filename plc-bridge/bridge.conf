# =====================================================================
#  Configuracion del plc-bridge (Preparacion - llenado de tanques)
#  Manual completo: Manual-plc-bridge.pdf (en esta misma carpeta)
#
#  Reglas:
#   - Una linea por ajuste: CLAVE=VALOR (sin espacios alrededor del "=").
#   - Las lineas que empiezan con "#" son comentarios.
#   - Despues de cambiar algo hay que REINICIAR el bridge: en la PC de
#     prueba, cerrar y volver a abrir el .bat; en el servidor:
#     docker compose --env-file .env.local --profile preview restart plc-bridge
#   - Si la misma clave se define en el .bat o en docker-compose.yml, gana
#     esa (los .bat solo definen PLC_MODO).
# =====================================================================

# ---------------------------------------------------------------------
#  1. Modo de trabajo
#     simulacion = datos inventados, sin PLC
#     real       = lee el PLC de verdad
# ---------------------------------------------------------------------
PLC_MODO=simulacion

# ---------------------------------------------------------------------
#  2. A donde envia la informacion (servidor WebSocket del bridge)
#     El dashboard y prueba-visual.html se conectan a ws://<IP>:<puerto>
# ---------------------------------------------------------------------
PLC_BRIDGE_PUERTO=4036
# 0.0.0.0 = acepta conexiones desde cualquier PC de la red
PLC_BRIDGE_HOST=0.0.0.0
# Cada cuantos milisegundos se lee el PLC y se envian los datos (100 a 500)
PLC_BRIDGE_INTERVALO_MS=200

# ---------------------------------------------------------------------
#  3. De donde lee la informacion (PLC de origen)
#     PLC_1: S7-1200 CPU 1212C, proyecto "Prom_Preparacion"
# ---------------------------------------------------------------------
PLC_HOST=192.168.0.10
PLC_PUERTO=102
PLC_RACK=0
# Slot 1 para S7-1200/1500, slot 2 para S7-300/400
PLC_SLOT=1
# Milisegundos de espera antes de dar la conexion por fallida / reintentar
PLC_TIMEOUT_MS=5000
PLC_RECONEXION_MS=5000

# ---------------------------------------------------------------------
#  4. Tags base (los usa la pantalla para dibujar los tanques)
#     Formato: DB<numero>,<TIPO><offset>   Ej: DB5,DINT0  DB5,REAL4  DB5,X14.0
#     Tipos: X (Bool), BYTE, CHAR, INT, WORD, DINT, DWORD, REAL
#     NO cambiar el nombre de estas claves, solo la direccion.
# ---------------------------------------------------------------------
PLC_TAG_SETPOINT=DB5,DINT0
PLC_TAG_LITROS_ACTUALES=DB5,DINT4
PLC_TAG_TOTALES=DB5,DINT8
PLC_TAG_TANQUE_ACTIVO=DB5,INT12

# Valvulas de entrada de agua (una por tanque)
PLC_TAG_VALVULA_1=DB5,X14.0
PLC_TAG_VALVULA_2=DB5,X14.1
PLC_TAG_VALVULA_3=DB5,X14.2

# Valvulas auxiliares (recirculacion / CIP, misma valvula fisica)
PLC_TAG_AUX_1=DB5,X14.3
PLC_TAG_AUX_2=DB5,X14.4
PLC_TAG_AUX_3=DB5,X14.5

# Opcional: tag de caudal directo del PLC. Vacio = se calcula con los litros.
PLC_TAG_CAUDAL=

# ---------------------------------------------------------------------
#  5. Tags adicionales (libres)
#     Para agregar un dato nuevo del PLC: una linea PLC_EXTRA_<NOMBRE>=<direccion>
#     El NOMBRE solo con MAYUSCULAS, numeros y "_". Aparece en la pantalla en
#     "Otros datos del PLC" y en el mensaje crudo como extra.<nombre>.
#     Ejemplos (quitar el "#" para activarlos):
# ---------------------------------------------------------------------
# PLC_EXTRA_TEMPERATURA_AGUA=DB5,REAL16
# PLC_EXTRA_BOMBA_ENCENDIDA=DB5,X20.0
