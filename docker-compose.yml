services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    # El volumen de node_modules sobrevive a los rebuild: si se agregó un paquete (ej. html-to-image),
    # quedaba sin instalar y las pantallas daban "Cannot find module". Al arrancar se instala lo que falte.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

  preview:
    build:
      context: .
      target: preview
    ports:
      - "4035:4173"
    # Vite reenvía /api y /archivos a estos contenedores (ver vite.config.ts).
    environment:
      - API_DESTINO=http://api:3000
      - ARCHIVOS_DESTINO=http://archivos:4038
    depends_on:
      - api
      - archivos
    restart: unless-stopped
    profiles:
      - preview

  # PostgREST: la API de la base PostgreSQL (lo que antes daba Supabase).
  # Los datos de conexión salen de .env.local (DB_*), por eso se levanta con
  #   docker compose --env-file .env.local --profile preview up -d --build
  # PGRST_DB_URI vacío = usa las variables PG* de abajo (libpq), así una
  # clave con caracteres raros no rompe la cadena de conexión.
  api:
    image: postgrest/postgrest:v12.2.3
    ports:
      - "4037:3000"
    environment:
      - PGRST_DB_URI=postgresql://
      - PGHOST=${DB_HOST:?Falta DB_HOST - levantar con --env-file .env.local}
      - PGPORT=${DB_PORT:-5432}
      - PGDATABASE=${DB_NAME:?Falta DB_NAME}
      - PGUSER=${DB_USER:?Falta DB_USER}
      - PGPASSWORD=${DB_PASSWORD:?Falta DB_PASSWORD}
      - PGSSLMODE=prefer
      - PGRST_DB_SCHEMAS=public
      - PGRST_DB_ANON_ROLE=anon
    restart: unless-stopped
    profiles:
      - preview

  # Los PDF de las actas (lo que antes era el Storage de Supabase). La
  # carpeta queda FUERA del proyecto para que sincronizar con WinSCP no
  # la borre: /home/inf05/natulac-actas si el proyecto está en
  # /home/inf05/natulac-aseptico.
  archivos:
    build:
      context: ./archivos
    ports:
      - "4038:4038"
    volumes:
      - ../natulac-actas:/datos/actas
    restart: unless-stopped
    profiles:
      - preview

  plc-bridge:
    build:
      context: ./plc-bridge
    ports:
      - "4036:4036"
    environment:
      # Dejar en "simulacion" hasta confirmar que el servidor tiene ruta de
      # red hacia 192.168.0.0/24 (subred del PLC, distinta de la 192.168.10.0/24
      # de este servidor) y el significado de Actuador_Aux_Tank_X. Ver
      # plc-bridge/.env.example para el detalle de cada variable.
      - PLC_MODO=simulacion
      - PLC_BRIDGE_PUERTO=4036
      - PLC_BRIDGE_INTERVALO_MS=200
      - PLC_HOST=192.168.0.10
      - PLC_PUERTO=102
      - PLC_RACK=0
      - PLC_SLOT=1
      - PLC_TAG_SETPOINT=DB5,DINT0
      - PLC_TAG_LITROS_ACTUALES=DB5,DINT4
      - PLC_TAG_TANQUE_ACTIVO=DB5,INT12
      - PLC_TAG_VALVULA_1=DB5,X14.0
      - PLC_TAG_VALVULA_2=DB5,X14.1
      - PLC_TAG_VALVULA_3=DB5,X14.2
      - PLC_TAG_AUX_1=DB5,X14.3
      - PLC_TAG_AUX_2=DB5,X14.4
      - PLC_TAG_AUX_3=DB5,X14.5
      - PLC_TAG_TOTALES=DB5,DINT8
    restart: unless-stopped
    profiles:
      - preview
