services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  preview:
    build:
      context: .
      target: preview
    ports:
      - "4035:4173"
    restart: unless-stopped
    profiles:
      - preview
